<!DOCTYPE html>
<html lang="ru">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Космический гид по планетам</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Солнечная система 🌌</h1>
        <p>Исследуй планеты нашей звездной системы</p>
    </header>
    
    <main class="grid">
        <div class="card">
            <h2>🌍 Земля</h2>
            <p>Наш дом, единственная известная планета с жидкой водой на поверхности.</p>
        </div>
        <div class="card">
            <h2>🔴 Марс</h2>
            <p>Красная планета с высочайшим вулканом в Солнечной системе — Олимпом.</p>
        </div>
        <div class="card">
            <h2>🪐 Сатурн</h2>
            <p>Газовый гигант, знаменитый своими яркими кольцами из льда и пыли.</p>
        </div>
    </main>
</body>
</html>
